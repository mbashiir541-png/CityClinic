<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City Clinic</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f766e'/><path d='M13 8h6v5h5v6h-5v5h-6v-5H8v-6h5z' fill='white'/></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Login -->
  <section id="login" class="login-page" hidden>
    <form class="login-card" id="login-form" novalidate>
      <div class="brand"><span class="brand-logo">+</span> City Clinic</div>
      <h1>Sign in</h1>
      <p class="muted">Clinic management system</p>
      <div id="login-error" class="form-error" hidden></div>
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit">Sign in</button>
      <div class="demo-accounts">
        Sample accounts: <code>admin@clinic.com / Admin@123</code>,
        <code>ali@clinic.com / Reception@123</code>, <code>ahmed@clinic.com / Doctor@123</code>
      </div>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-logo">+</span> City Clinic</div>
      <ul class="nav" id="nav"></ul>
      <div class="sidebar-footer">
        <div class="who" id="who-name"></div>
        <div id="who-roles" class="small"></div>
        <button class="btn sm" id="btn-password" type="button">Change password</button>
        <button class="btn sm" id="btn-logout" type="button">Sign out</button>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="btn-menu" type="button" aria-label="Open menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="brand"><span class="brand-logo">+</span> City Clinic</div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
